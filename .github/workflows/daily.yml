name: 每日需求词挖掘

on:
  schedule:
    # UTC 01:00 ≈ 北京时间 09:00，抓取「前一天」发布的 Product Hunt 产品
    - cron: "0 1 * * *"
  workflow_dispatch: {}   # 允许在 Actions 页面手动触发

permissions:
  contents: write

jobs:
  mine:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 运行挖掘
        env:
          PH_API_TOKEN: ${{ secrets.PH_API_TOKEN }}
        run: python run.py

      - name: 提交产出
        run: |
          git config user.name "demand-miner[bot]"
          git config user.email "demand-miner@users.noreply.github.com"
          git add data public
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "chore: 每日需求词挖掘 $(date +%F)"
            git push
          fi

      - name: 上传产出（备用）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demand-report-${{ github.run_id }}
          path: |
            data/
            public/
          retention-days: 30
