name: 探测解析方案（手动）

# 仅用于诊断：在 GitHub runner 上实测哪种方式能解析 producthunt.com/r/ 短链。
# 不出产物、不改数据，诊断完成后可删除本文件与 probe.py。
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: |
          pip install requests playwright
          python -m playwright install --with-deps chromium

      - name: 运行探测
        run: python probe.py
